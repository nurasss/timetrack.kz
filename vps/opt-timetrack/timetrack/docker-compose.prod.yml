services:
  caddy:
    image: caddy:2.10.0-alpine
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    environment:
      ACME_EMAIL: "${ACME_EMAIL:?set ACME_EMAIL}"
      TIMETRACK_DOMAIN: "${TIMETRACK_DOMAIN:?set TIMETRACK_DOMAIN}"
      TIMETRACK_WWW_DOMAIN: "${TIMETRACK_WWW_DOMAIN:?set TIMETRACK_WWW_DOMAIN}"
      NODE_API_UPSTREAM: "${NODE_API_UPSTREAM:-dev-api:8787}"
      FASTAPI_UPSTREAM: "${FASTAPI_UPSTREAM:-api:8000}"
      LEGACY_BASTION_IP: "${LEGACY_BASTION_IP:-127.0.0.1}"
      LEGACY_BASTION_UPSTREAM_3000: "${LEGACY_BASTION_UPSTREAM_3000:-127.0.0.1:3000}"
      LEGACY_BASTION_UPSTREAM_3100: "${LEGACY_BASTION_UPSTREAM_3100:-127.0.0.1:3100}"
      LEGACY_BASTION_UPSTREAM_3200: "${LEGACY_BASTION_UPSTREAM_3200:-127.0.0.1:3200}"
      LEGACY_BASTION_UPSTREAM_8000: "${LEGACY_BASTION_UPSTREAM_8000:-127.0.0.1:8000}"
      LEGACY_ADMIN_UPSTREAM: "${LEGACY_ADMIN_UPSTREAM:-127.0.0.1:8092}"
      LEGACY_DRAMA_UPSTREAM: "${LEGACY_DRAMA_UPSTREAM:-drama-caddy:80}"
      LEGACY_POSCENTER_HOST: "${LEGACY_POSCENTER_HOST:-poscenter-api.example.invalid}"
      LEGACY_POSCENTER_UPSTREAM: "${LEGACY_POSCENTER_UPSTREAM:-poscenter-backend:8000}"
      LEGACY_SSLIP_HOST: "${LEGACY_SSLIP_HOST:-legacy.example.invalid}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "./Caddyfile:/etc/caddy/Caddyfile:ro"
      - "./infra/caddy:/etc/caddy/staged:ro"
      - "./dev-timetrack/public:/srv/dev-timetrack:ro"
      - caddy_data:/data
      - caddy_config:/config
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.50
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:2019/config/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - edge
      - proxy
      - backend
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  dev-api:
    image: node:24.2.0-alpine3.21
    restart: unless-stopped
    init: true
    user: "${DEV_API_UID:-10001}:${DEV_API_GID:-10001}"
    working_dir: /app
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    command: ["node", "server.js"]
    environment:
      NODE_ENV: production
      PORT: "8787"
      TIMETRACK_DATA_DIR: /var/lib/timetrack
      TIMETRACK_API_ONLY: "1"
    volumes:
      - "./dev-timetrack:/app:ro"
      - "${DEV_DATA_DIR:?set DEV_DATA_DIR}:/var/lib/timetrack"
    expose:
      - "8787"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.50
    healthcheck:
      test: ["CMD", "node", "-e", "const net=require('net');const s=net.connect(8787,'127.0.0.1',()=>{s.destroy();process.exit(0)});s.on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - proxy
      - data
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  postgres:
    image: postgres:16.10-alpine3.22
    restart: unless-stopped
    init: true
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?set POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER:?set POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1g
    cpus: 1.00
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - data
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  redis:
    image: redis:7.4.6-alpine3.21
    restart: unless-stopped
    init: true
    command: ["sh", "-c", "exec redis-server --appendonly yes --save 60 1 --requirepass \"$${REDIS_PASSWORD}\""]
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?set REDIS_PASSWORD}"
    volumes:
      - redis_data:/data
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.50
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - data
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  minio:
    image: minio/minio:RELEASE.2025-10-15T17-29-55Z
    restart: unless-stopped
    init: true
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:?set MINIO_ROOT_USER}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}"
    volumes:
      - minio_data:/data
    expose:
      - "9000"
      - "9001"
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1g
    cpus: 1.00
    networks:
      - data
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    image: timetrack-api:${RELEASE_TAG:?set RELEASE_TAG}
    restart: unless-stopped
    init: true
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      DATABASE_URL: "${DATABASE_URL:?set DATABASE_URL}"
      REDIS_URL: "${REDIS_URL:?set REDIS_URL}"
      JWT_SECRET: "${JWT_SECRET:?set JWT_SECRET}"
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-15}"
      JWT_REFRESH_TOKEN_EXPIRE_DAYS: "${JWT_REFRESH_TOKEN_EXPIRE_DAYS:-30}"
      APP_ENV: production
      APP_URL: "${APP_URL:?set APP_URL}"
      API_URL: "${API_URL:?set API_URL}"
      CORS_ORIGINS: "${CORS_ORIGINS:?set CORS_ORIGINS}"
      MINIO_ENDPOINT: "minio:9000"
      MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY:?set MINIO_ACCESS_KEY}"
      MINIO_SECRET_KEY: "${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY}"
      MINIO_BUCKET: "${MINIO_BUCKET:?set MINIO_BUCKET}"
      SMTP_HOST: "${SMTP_HOST:?set SMTP_HOST}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USERNAME: "${SMTP_USERNAME:?set SMTP_USERNAME}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:?set SMTP_PASSWORD}"
      SMTP_FROM_EMAIL: "${SMTP_FROM_EMAIL:?set SMTP_FROM_EMAIL}"
      SMTP_USE_TLS: "${SMTP_USE_TLS:-true}"
    expose:
      - "8000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 512m
    cpus: 1.00
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - backend
      - data
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  web:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    image: timetrack-web:${RELEASE_TAG:?set RELEASE_TAG}
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-}"
    expose:
      - "3000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 512m
    cpus: 1.00
    healthcheck:
      test: ["CMD", "node", "-e", "const http=require('http');const r=http.get('http://127.0.0.1:3000/',(res)=>process.exit(res.statusCode<500?0:1));r.on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - backend
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

volumes:
  postgres_data:
  redis_data:
  minio_data:
  caddy_data:
  caddy_config:

networks:
  edge:
  proxy:
    internal: true
  backend:
    internal: true
  data:
    internal: true
