services:
  postgres:
    image: postgres:16.10-alpine3.22
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-local-dev-db}"
      POSTGRES_USER: "${POSTGRES_USER:-local-dev-user}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-local-dev-password}"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4.6-alpine3.21
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:RELEASE.2025-10-15T17-29-55Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-local-dev-minio}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-local-dev-minio-password}"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  api:
    build:
      context: ../apps/api
    env_file:
      - ../.env.example
    environment:
      DATABASE_URL: "${DATABASE_URL:-postgresql+asyncpg://local-dev-user:local-dev-password@postgres:5432/local-dev-db}"
      REDIS_URL: "${REDIS_URL:-redis://redis:6379/0}"
      APP_URL: "${APP_URL:-http://localhost:3000}"
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001}"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  web:
    build:
      context: ..
      dockerfile: apps/admin/Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://localhost:8000}"
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  minio_data:
