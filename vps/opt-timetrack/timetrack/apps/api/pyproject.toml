[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "timetrack-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13.2",
  "asyncpg>=0.29.0",
  "bcrypt==4.0.1",
  "email-validator>=2.2.0",
  "fastapi>=0.111.0",
  "greenlet>=3.0.3",
  "httpx>=0.27.0",
  "openpyxl>=3.1.5",
  "passlib[bcrypt]>=1.7.4",
  "pydantic-settings>=2.3.4",
  "PyJWT>=2.8.0",
  "python-multipart>=0.0.9",
  "redis>=5.0.7",
  "ruff>=0.5.5",
  "sqlalchemy[asyncio]>=2.0.31",
  "uvicorn[standard]>=0.30.1"
]

[project.optional-dependencies]
test = ["pip-audit>=2.7.0", "pytest>=8.2.2", "pytest-asyncio>=0.23.7"]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["migrations*"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["B008"]
